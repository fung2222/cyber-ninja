<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05010f">
<meta name="description" content="異域凶間 XENO NIGHTMARE — 3D 賽博朋克直向射擊，10 章 50 關戰役及無盡模式。3D cyberpunk shooter with a 50-level campaign, distinct chapter bosses and endless mode.">
<title data-i18n="doc.title">XENO NIGHTMARE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%2305010f%22/%3E%3Cpath d=%22M16 4l4 9 9 3-9 3-4 9-4-9-9-3 9-3z%22 fill=%22none%22 stroke=%22%2300e5ff%22 stroke-width=%222%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%222.5%22 fill=%22%23ff2bd6%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/cyber-kit/ui/hud.css?v=0.3.17">
<link rel="stylesheet" href="./css/game.css?v=2.6">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/cyber-kit/three/three.module.min.js",
    "three/addons/": "./vendor/cyber-kit/three/addons/",
    "cyber-kit": "./vendor/cyber-kit/kit.js?v=0.3.22b",
    "cyber-kit/": "./vendor/cyber-kit/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fx-flash"></div>
<div id="scanlines"></div>
<div id="vignette-danger"></div>
<div id="vignette-od"></div>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-score">
      <div class="label" data-i18n="score"></div>
      <div class="value" id="hud-score">0</div>
      <div class="best"><span data-i18n="best"></span> <b id="hud-best">0</b></div>
    </div>
    <div class="hud-center">
      <div class="wave-line"><span data-i18n="wave"></span><b id="hud-wave">1</b></div>
      <div class="mission-line" id="hud-mission">CH.01-1 · 霓虹九龍</div>
    </div>
    <div class="hud-right">
      <div class="hud-buttons">
        <button id="btn-pause" class="icon-btn util-btn" data-i18n-attr="title:pauseTip,aria-label:pauseTip"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
        <button id="btn-mute" class="icon-btn util-btn" data-i18n-attr="title:muteTip,aria-label:muteTip">
          <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="combo-chip"><b id="combo-mult">×2</b><span data-i18n="combo"></span><i class="combo-ring"></i></div>
  <div id="boss-bar" class="boss-bar hidden">
    <div class="bb-name"><span id="bb-name"></span> <em id="bb-sub"></em></div>
    <div class="bb-track"><div class="bb-fill" id="boss-fill"></div><i class="bb-seg" style="left:33%"></i><i class="bb-seg" style="left:66%"></i></div>
  </div>
  <div class="action-dock">
    <div class="skill-stack">
      <button id="btn-od" class="od-btn" data-i18n-attr="aria-label:od" data-no-input>
        <span class="od-txt"><b id="od-label" data-i18n="od">最大火力</b><small id="od-sub" data-i18n="odS">昇華</small></span>
      </button>
      <button id="btn-ult" class="ult-btn" data-i18n-attr="aria-label:ultName" data-no-input>
        <span class="ult-txt"><b id="ult-label" data-i18n="ult"></b><small id="ult-sub" data-i18n="ultS"></small></span>
      </button>
    </div>
    <div class="combat-readout" id="combat-readout">
      <div class="cr-row cr-craft"><b id="hud-craft">VX-01 · 蒼隼</b></div>
      <div class="cr-row cr-weapon"><b id="cr-weapon">脈衝</b><span id="cr-wlv">LV.1</span><div class="lv-pips" id="cr-lv"></div></div>
      <div class="cr-row cr-shield"><span class="hp-label" data-i18n="shield"></span><div class="hp-pips" id="cr-hp"></div><em id="cr-hp-num">3/3</em></div>
    </div>
  </div>
  <div id="demo-tag" class="demo-tag hidden" data-i18n="kit.demo"></div>
  <div id="fps" class="fps hidden">-- FPS</div>
</div>

<div id="screen-start" class="screen hero menu-home">
  <div class="menu-top">
    <div class="menu-top-left"><button type="button" class="menu-icon-btn" id="btn-arcade-menu" data-i18n-attr="title:kit.arcadeMenu,aria-label:kit.arcadeMenu"></button></div>
    <div class="menu-top-right"></div>
  </div>
  <div class="menu-body">
    <div class="menu-mid">
      <div class="menu-brand">
      <div class="kicker">NEON KOWLOON · ORBITAL DEFENSE</div>
      <h1 class="title glitch" id="title" data-i18n="title">異域凶間</h1>
      <div class="title-en" data-i18n="titleEn"></div>
      <div class="subtitle" data-i18n="subtitle"></div>
      <p class="tagline" data-i18n-html="tagline"></p>
    </div>
      <div class="menu-cta">
      <button class="neon-btn" id="btn-start"><span data-i18n="launch"></span><small data-i18n="launchS"></small></button>
      <button class="neon-btn ghost" id="btn-chapters"><span data-i18n="chaptersBtn"></span><small data-i18n="chaptersBtnS"></small></button>
    </div>
    </div>
    <div class="menu-meta">
      <div class="hi-line"><span class="hi"><span data-i18n="best"></span> <b id="start-best">0</b></span><span class="hi"><span data-i18n="bestWave"></span> <b id="start-wave">—</b></span></div>
    </div>
  </div>
</div>

<div id="screen-hangar" class="screen hidden">
  <div class="hangar">
    <div class="hangar-head">
      <div class="select-title hangar-title"><span data-i18n="selectCraft"></span><em data-i18n="selectCraftS"></em></div>
      <button type="button" class="hangar-back" id="btn-hangar-back" data-i18n-attr="aria-label:kit.back" aria-label="返回">←</button>
    </div>
    <div class="hangar-main">
      <div class="hangar-stage craft-stage">
        <canvas id="craft-canvas"></canvas>
        <div class="stage-index">AIRFRAME / 01—03</div>
        <div class="hangar-craft-id" id="craft-id"></div>
      </div>
      <div class="hangar-info craft-info" id="craft-info">
        <div class="info-kicker" data-i18n="pilotBrief">PILOT BRIEF</div>
        <div class="ci-passive" id="craft-passive"></div>
        <div class="ci-stats" id="craft-stats"></div>
        <div class="ci-blurb" id="craft-blurb"></div>
      </div>
    </div>
    <div class="hangar-select" id="craft-row"></div>
    <div class="hangar-foot">
      <button class="neon-btn" id="btn-hangar-next"><span data-i18n="nextPage"></span><small data-i18n="nextPageS"></small></button>
    </div>
  </div>
</div>

<div id="screen-weapon" class="screen hidden">
  <div class="hangar">
    <div class="hangar-head">
      <div class="select-title hangar-title"><span data-i18n="selectWeapon"></span><em data-i18n="selectWeaponS"></em></div>
      <button type="button" class="hangar-back" id="btn-weapon-back" data-i18n-attr="aria-label:kit.back" aria-label="返回">←</button>
    </div>
    <div class="hangar-main weapon-main">
      <div class="hangar-stage weapon-stage">
        <video id="weapon-video" muted loop playsinline preload="metadata" aria-label="Real gameplay weapon preview"></video>
        <div class="stage-index"><span data-i18n="realFootage"></span> · LV.6 + ULT</div>
        <div class="hangar-craft-id" id="weapon-id"></div>
      </div>
      <div class="hangar-info weapon-info">
        <div class="ci-stats" id="weapon-stats"></div>
        <div class="tech-tree">
          <div class="tree-detail" id="tree-detail"></div>
        </div>
      </div>
    </div>
    <div class="hangar-select" id="weapon-row"></div>
    <div class="hangar-foot">
      <button class="neon-btn" id="btn-weapon-go"><span data-i18n="toMission"></span><small data-i18n="toMissionS"></small></button>
    </div>
  </div>
</div>

<div id="screen-difficulty" class="screen hidden">
  <div class="hangar mission-hangar">
    <div class="hangar-head">
      <div class="select-title hangar-title"><span data-i18n="selectDifficulty"></span><em data-i18n="selectDifficultyS"></em></div>
      <button type="button" class="hangar-back" id="btn-difficulty-back" data-i18n-attr="aria-label:kit.back">←</button>
    </div>
    <div class="hangar-main difficulty-main">
      <div class="difficulty-hero">
        <div class="diff-orb" id="diff-orb">
          <i class="face f1">◇</i><i class="face f2">◇</i><i class="face f3">◇</i>
        </div>
        <div class="hangar-craft-id" id="difficulty-id"></div>
      </div>
      <div class="hangar-info difficulty-info">
        <div class="difficulty-head"><span data-i18n="difficulty"></span><small id="difficulty-desc2"></small></div>
        <div class="difficulty-row diff-cards" id="difficulty-row2"></div>
        <div class="difficulty-note" data-i18n="difficultyNote"></div>
      </div>
    </div>
    <div class="hangar-foot">
      <button class="neon-btn" id="btn-difficulty-go"><span data-i18n="deployNow"></span><small data-i18n="deployNowS"></small></button>
    </div>
  </div>
</div>

<div id="screen-mission" class="screen hidden">
  <div class="hangar mission-hangar records-hangar">
    <div class="hangar-head">
      <div class="select-title hangar-title"><span data-i18n="chaptersTitle"></span><em data-i18n="chaptersTitleS"></em></div>
      <button type="button" class="hangar-back records-back" id="btn-mission-back" data-i18n-attr="aria-label:kit.back" aria-label="返回">←</button>
    </div>
    <div class="records-main" data-scroll>
      <section class="records-brief">
        <div class="rec-index" id="record-index">第 1 章</div>
        <h2 id="mission-name"></h2>
        <p id="mission-story"></p>
        <div class="rec-best"><span data-i18n="chapterBest"></span><b id="chapter-best">0</b></div>
      </section>
    </div>
    <nav class="records-grid" id="chapter-nav" aria-label="Campaign chapters"></nav>
  </div>
</div>


<div id="deploy-fx" class="hidden" aria-hidden="true">
  <div class="df-tunnel">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
  <div class="df-mark">
    <i class="df-face a">◇</i><i class="df-face b">◇</i><i class="df-face c">◇</i>
  </div>
  <div class="df-flash"></div>
</div>
<div id="screen-pause" class="screen hidden">
  <div class="panel small">
    <h2 class="title2 glitch" data-i18n="kit.paused">已暫停</h2>
    <div class="title-en" data-i18n="pausedS"></div>
    <div class="pause-craft" id="pause-craft"></div>
    <button class="neon-btn" id="btn-resume"><span data-i18n="kit.resume"></span><small>P</small></button>
    <button class="neon-btn ghost" id="btn-quit"><span data-i18n="abort"></span><small data-i18n="kit.menu"></small></button>
    <button class="neon-btn ghost" id="btn-settings-pause"><span data-i18n="kit.settings"></span><small>SETTINGS</small></button>
  </div>
</div>

<div id="screen-over" class="screen hidden">
  <div class="panel">
    <div class="kicker danger" id="over-kicker" data-i18n="signalLost"></div>
    <h2 class="title2 glitch danger" id="over-title" data-i18n="failed">任務失敗</h2>
    <div class="title-en" id="over-subtitle" data-i18n="overS"></div>
    <div id="newrecord" class="newrecord hidden" data-i18n="kit.newRecord"></div>
    <div class="results">
      <div><span data-i18n="score"></span><b id="over-score">0</b></div>
      <div><span data-i18n="wave"></span><b id="over-wave">0</b></div>
      <div><span data-i18n="kills"></span><b id="over-kills">0</b></div>
      <div><span data-i18n="best"></span><b id="over-best">0</b></div>
    </div>
    <div class="over-craft" id="over-craft"></div>
    <button class="neon-btn" id="btn-revive"><span data-i18n="revive"></span><small id="revive-sub">CONTINUE · WATCH AD</small></button>
    <button class="neon-btn ghost" id="btn-retry"><span data-i18n="retry"></span><small>ENTER</small></button>
    <button class="neon-btn ghost" id="btn-menu"><span data-i18n="kit.menu"></span><small></small></button>
  </div>
</div>

<script type="module" src="./js/main.js?v=2.7"></script>
</body>
</html>
